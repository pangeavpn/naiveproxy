name: Build
on:
  push:
    branches: [master]
    paths-ignore: [README.md]
  pull_request:
    branches: [master]
    paths-ignore: [README.md]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Build only the Windows jobs (for validating pangea_naive changes without the full cross-platform matrix)"
        type: boolean
        default: false
defaults:
  run:
    shell: bash
    working-directory: src
env:
  CACHE_EPOCH: 1
  CCACHE_MAXSIZE: 200M
  CCACHE_MAXFILES: 0
  SCCACHE_CACHE_SIZE: 200M
# gh release upload needs write access; the default GITHUB_TOKEN is read-only.
permissions:
  contents: write
jobs:
  cache-toolchains-posix:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains (Linux, OpenWrt, Android)
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (Linux, OpenWrt)
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/
          key: pgo-linux-openwrt-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache Android NDK (Android)
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Host tool ccache
        uses: actions/cache@v4
        with:
          path: src/.host_tool_cache
          key: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache
      - run: EXTRA_FLAGS='target_os="android" target_cpu="x64"' ./get-clang.sh
      - run: |
          if [ ! -f qemu-user*.deb ]; then
            wget https://snapshot.debian.org/archive/debian/20250405T083429Z/pool/main/q/qemu/qemu-user_9.2.2%2Bds-1%2Bb2_amd64.deb
          fi
      - run: EXTRA_FLAGS='target_os="android" target_cpu="x64"' WARMUP_HOST_TOOLS=1 ./build.sh
  cache-toolchains-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (win64)
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win64-*
          key: pgo-win64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (win32)
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win32-*
          key: pgo-win32-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh
      - run: EXTRA_FLAGS='target_cpu="x86"' ./get-clang.sh
      - run: |
          if [ ! -f ~/bin/ninja.exe ]; then
            curl -LO https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip
            unzip ninja-win.zip -d ~/bin
          fi
  cache-toolchains-mac-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
          key: toolchains-pgo-mac-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="x64"' ./get-clang.sh
  cache-toolchains-mac-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
          key: toolchains-pgo-mac-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - run: EXTRA_FLAGS='target_cpu="arm64"' ./get-clang.sh
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    needs: cache-toolchains-posix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64, arm, mipsel, mips64el, riscv64, loong64]
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}"'
      BUNDLE: naiveproxy-${{ github.event.release.tag_name }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains (Linux, OpenWrt, Android)
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (Linux, OpenWrt)
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/
          key: pgo-linux-openwrt-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Regenerate Debian keyring
        run: |
          rm -f ./build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./build/linux/sysroot_scripts/generate_keyring.sh
      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: |
            src/out/sysroot-build/bullseye/bullseye_*
            src/out/sysroot-build/trixie/trixie_*
            src/out/sysroot-build/sid/sid_*
          key: sysroot-linux-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Host tool ccache
        uses: actions/cache@v4
        with:
          path: src/.host_tool_cache
          key: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-linux-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache bubblewrap
          sudo apt remove -y qemu-user-binfmt
          sudo dpkg -i qemu-user*.deb
          # libc6-i386 interferes with x86 build
          sudo apt remove libc6-i386
      - run: ./get-clang.sh
      - run: ccache -z
      - run: ./build.sh
      - run: ccache -s && ccache --evict-older-than 1d
      - run: ../tests/basic.sh out/Release/naive
      - name: Pack naiveproxy assets
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/naive config.json ../LICENSE ../USAGE.txt ${{ env.BUNDLE }}
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
          openssl sha256 out/Release/naive >sha256sum.txt
          echo "SHA256SUM=$(cut -d' ' -f2 sha256sum.txt)" >>$GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz naive executable sha256 ${{ env.SHA256SUM }}
          path: src/sha256sum.txt
      - name: Upload naiveproxy assets
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${GITHUB_REF##*/}" ${{ env.BUNDLE }}.tar.xz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    needs: cache-toolchains-posix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            abi: x86_64
          - arch: x86
            abi: x86
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
    env:
      # arm64 also ships libpangea_naive.a, which gomobile cgo-links with the
      # NDK clang: native objects, not thin-LTO bitcode (is_cfi rides on LTO).
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" target_os="android"${{ matrix.arch == ''arm64'' && '' use_thin_lto=false is_cfi=false'' || '''' }}'
      BUNDLE: naiveproxy-plugin-${{ github.event.release.tag_name || 'v1.1.1.1-1' }}-${{ matrix.abi }}.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Cache toolchains (Linux, OpenWrt, Android)
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            src/qemu-user*.deb
          key: toolchains-posix-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache Android NDK (Android)
        uses: actions/cache@v4
        with:
          path: src/third_party/android_toolchain/ndk/
          key: android-ndk-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: src/out/sysroot-build/android/
          key: sysroot-android-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Host tool ccache
        uses: actions/cache@v4
        with:
          path: src/.host_tool_cache
          key: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-posix-${{ hashFiles('CHROMIUM_VERSION') }}-
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-android-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-
      - name: Install APT packages
        run: |
          sudo apt update
          sudo apt install ninja-build pkg-config ccache bubblewrap
          sudo apt remove -y qemu-user-binfmt
          sudo dpkg -i qemu-user*.deb
          # libc6-i386 interferes with x86 build
          sudo apt remove libc6-i386
      - run: ./get-clang.sh
      - run: ccache -z
      - run: ./build.sh
      - run: ccache -s && ccache --evict-older-than 1d
      - run: ./get-android-sys.sh
      - run: ../tests/basic.sh out/Release/naive
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Create APK
        working-directory: apk
        env:
          APK_ABI: ${{ matrix.abi }}
          APK_VERSION_NAME: ${{ github.event.release.tag_name || 'v1.1.1.1-1' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p app/libs/$APK_ABI
          cp ../src/out/Release/naive app/libs/$APK_ABI/libnaive.so
          ./gradlew :app:assembleRelease
          openssl sha256 app/build/outputs/apk/release/${{ env.BUNDLE }} >sha256sum.txt
          echo "SHA256SUM=$(cut -d' ' -f2 sha256sum.txt)" >>$GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }} sha256 ${{ env.SHA256SUM }}
          path: apk/sha256sum.txt
      - name: Upload naiveproxy assets
        if: ${{ github.event_name == 'release' }}
        working-directory: apk/app/build/outputs/apk/release
        # Don't let an APK upload hiccup abort the job before the
        # Android-critical libpangea_naive.a upload below.
        continue-on-error: true
        run: gh release upload "${GITHUB_REF##*/}" ${{ env.BUNDLE }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack pangea_naive static-lib assets
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          ninja -C out/Release pangea_naive
          mkdir pangea-naive-android-${{ matrix.abi }}
          cp out/Release/obj/net/libpangea_naive.a pangea-naive-android-${{ matrix.abi }}/
          cp pangea/capi/pangea_naive_capi.h pangea-naive-android-${{ matrix.abi }}/
          zip -r pangea-naive-android-${{ matrix.abi }}.zip pangea-naive-android-${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.arch == 'arm64' }}
        with:
          name: pangea-naive-android-${{ matrix.abi }}.zip
          path: src/pangea-naive-android-${{ matrix.abi }}.zip
      - name: Upload pangea_naive static-lib assets
        if: ${{ github.event_name == 'release' && matrix.arch == 'arm64' }}
        run: gh release upload "${GITHUB_REF##*/}" pangea-naive-android-${{ matrix.abi }}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  win:
    needs: cache-toolchains-win
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    env:
      # pangea_naive.lib is cgo-linked by the desktop daemon with a stock
      # clang-cl, so it must be native COFF objects, not thin-LTO bitcode
      # (which only links against the exact pinned Chromium clang). is_cfi
      # depends on LTO, so it is disabled alongside it.
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" use_thin_lto=false is_cfi=false'
      BUNDLE: naiveproxy-${{ github.event.release.tag_name }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/gn/
            ~/.cargo/bin/
            ~/bin/ninja.exe
          key: toolchains-win-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (win64)
        if: ${{ matrix.arch == 'x64' }}
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win64-*
          key: pgo-win64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - name: Cache PGO (win32)
        if: ${{ matrix.arch != 'x64' }}
        uses: actions/cache@v4
        with:
          path: src/chrome/build/pgo_profiles/chrome-win32-*
          key: pgo-win32-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: ccache-win-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-win-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-
      - run: ./get-clang.sh
      - run: ~/.cargo/bin/sccache -z
      - run: ./build.sh
      - run: ninja -C out/Release pangea_naive
      - run: ~/.cargo/bin/sccache -s
      - run: ../tests/basic.sh out/Release/naive
        # No real or emulated environment is available to test this.
        if: ${{ matrix.arch != 'arm64' }}
      - name: Pack naiveproxy assets
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/naive config.json ../LICENSE ../USAGE.txt ${{ env.BUNDLE }}
          7z a ${{ env.BUNDLE }}.zip ${{ env.BUNDLE }}
          openssl sha256 out/Release/naive.exe >sha256sum.txt
          echo "SHA256SUM=$(cut -d' ' -f2 sha256sum.txt)" >>$GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.zip naive executable sha256 ${{ env.SHA256SUM }}
          path: src/sha256sum.txt
      - name: Upload naiveproxy assets
        if: ${{ github.event_name == 'release' }}
        # Don't let an executable-bundle upload hiccup abort the job before the
        # desktop-critical pangea_naive.lib upload below.
        continue-on-error: true
        run: gh release upload "${GITHUB_REF##*/}"  ${{ env.BUNDLE }}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack pangea_naive static-lib assets
        run: |
          mkdir pangea-naive-${{ matrix.arch }}
          cp out/Release/obj/net/pangea_naive.lib pangea-naive-${{ matrix.arch }}/
          cp pangea/capi/pangea_naive_capi.h pangea-naive-${{ matrix.arch }}/
          7z a pangea-naive-${{ matrix.arch }}.zip pangea-naive-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: pangea-naive-${{ matrix.arch }}.zip
          path: src/pangea-naive-${{ matrix.arch }}.zip
      - name: Upload pangea_naive static-lib assets
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${GITHUB_REF##*/}" pangea-naive-${{ matrix.arch }}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mac-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    needs: cache-toolchains-mac-x64
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    env:
      # libpangea_naive.a is cgo-linked by the desktop daemon with the stock
      # Apple clang, so it must hold native Mach-O objects, not thin-LTO
      # bitcode (which only links against the exact pinned Chromium clang).
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" use_thin_lto=false'
      BUNDLE: naiveproxy-${{ github.event.release.tag_name }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains and PGO
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
          key: toolchains-pgo-mac-x64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-mac-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-
      - run: brew install ninja ccache
      - run: pip install setuptools
      - run: ./get-clang.sh
      - run: ccache -z
      - run: ./build.sh
      - run: ccache -s && ccache --evict-older-than 1d
      - run: ../tests/basic.sh out/Release/naive
      - name: Pack naiveproxy assets
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/naive config.json ../LICENSE ../USAGE.txt ${{ env.BUNDLE }}
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
          openssl sha256 out/Release/naive >sha256sum.txt
          echo "SHA256SUM=$(cut -d' ' -f2 sha256sum.txt)" >>$GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz naive executable sha256 ${{ env.SHA256SUM }}
          path: src/sha256sum.txt
      - name: Upload naiveproxy assets
        if: ${{ github.event_name == 'release' }}
        # Don't let an executable-bundle upload hiccup abort the job before the
        # desktop-critical libpangea_naive.a upload below.
        continue-on-error: true
        run: gh release upload "${GITHUB_REF##*/}" ${{ env.BUNDLE }}.tar.xz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack pangea_naive static-lib assets
        run: |
          ninja -C out/Release pangea_naive
          mkdir pangea-naive-mac-${{ matrix.arch }}
          cp out/Release/obj/net/libpangea_naive.a pangea-naive-mac-${{ matrix.arch }}/
          cp pangea/capi/pangea_naive_capi.h pangea-naive-mac-${{ matrix.arch }}/
          zip -r pangea-naive-mac-${{ matrix.arch }}.zip pangea-naive-mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: pangea-naive-mac-${{ matrix.arch }}.zip
          path: src/pangea-naive-mac-${{ matrix.arch }}.zip
      - name: Upload pangea_naive static-lib assets
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${GITHUB_REF##*/}" pangea-naive-mac-${{ matrix.arch }}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mac-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    needs: cache-toolchains-mac-arm64
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      # libpangea_naive.a is cgo-linked by the desktop daemon with the stock
      # Apple clang, so it must hold native Mach-O objects, not thin-LTO
      # bitcode (which only links against the exact pinned Chromium clang).
      EXTRA_FLAGS: 'target_cpu="${{ matrix.arch }}" use_thin_lto=false'
      BUNDLE: naiveproxy-${{ github.event.release.tag_name }}-${{ github.job }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchains and PGO
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build/Release+Asserts/
            src/chrome/build/pgo_profiles/chrome-mac-*
            src/gn/
          key: toolchains-pgo-mac-arm64-${{ hashFiles('CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - id: ccache-timestamp
        run: echo "CCACHE_TIMESTAMP=$(date +%s)" >>$GITHUB_OUTPUT
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-${{ steps.ccache-timestamp.outputs.CCACHE_TIMESTAMP }}
          restore-keys: ccache-mac-${{ matrix.arch }}-${{ hashFiles('CHROMIUM_VERSION') }}-
      - run: brew install ninja ccache
      - run: pip install setuptools
      - run: ./get-clang.sh
      - run: ccache -z
      - run: ./build.sh
      - run: ccache -s && ccache --evict-older-than 1d
      - run: ../tests/basic.sh out/Release/naive
      - name: Pack naiveproxy assets
        run: |
          mkdir ${{ env.BUNDLE }}
          cp out/Release/naive config.json ../LICENSE ../USAGE.txt ${{ env.BUNDLE }}
          tar cJf ${{ env.BUNDLE }}.tar.xz ${{ env.BUNDLE }}
          openssl sha256 out/Release/naive >sha256sum.txt
          echo "SHA256SUM=$(cut -d' ' -f2 sha256sum.txt)" >>$GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}.tar.xz naive executable sha256 ${{ env.SHA256SUM }}
          path: src/sha256sum.txt
      - name: Upload naiveproxy assets
        if: ${{ github.event_name == 'release' }}
        # Don't let an executable-bundle upload hiccup abort the job before the
        # desktop-critical libpangea_naive.a upload below.
        continue-on-error: true
        run: gh release upload "${GITHUB_REF##*/}" ${{ env.BUNDLE }}.tar.xz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack pangea_naive static-lib assets
        run: |
          ninja -C out/Release pangea_naive
          mkdir pangea-naive-mac-${{ matrix.arch }}
          cp out/Release/obj/net/libpangea_naive.a pangea-naive-mac-${{ matrix.arch }}/
          cp pangea/capi/pangea_naive_capi.h pangea-naive-mac-${{ matrix.arch }}/
          zip -r pangea-naive-mac-${{ matrix.arch }}.zip pangea-naive-mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: pangea-naive-mac-${{ matrix.arch }}.zip
          path: src/pangea-naive-mac-${{ matrix.arch }}.zip
      - name: Upload pangea_naive static-lib assets
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${GITHUB_REF##*/}" pangea-naive-mac-${{ matrix.arch }}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
